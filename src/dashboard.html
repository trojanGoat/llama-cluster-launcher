<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Llama Cluster Dashboard</title>
  <style>
    body {
      background: #1e1e1e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0; padding: 20px;
    }
    h1 { margin-top: 0; color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .card { background: #2d2d2d; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .card h2 { margin-top: 0; font-size: 1.2em; color: #4CAF50; display: flex; justify-content: space-between; align-items: center; }
    .badge { padding: 4px 8px; border-radius: 12px; font-size: 0.8em; font-weight: bold; background: #555; color: #fff; }
    .badge.running { background: #4CAF50; color: #fff; }
    .info-row { display: flex; justify-content: space-between; margin: 8px 0; border-bottom: 1px solid #3a3a3a; padding-bottom: 4px; }
    .info-row:last-child { border-bottom: none; }
    .stats-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .stat-box { background: #1a1a1a; padding: 8px; border-radius: 6px; flex: 1; min-width: 80px; text-align: center; }
    .stat-label { font-size: 0.75em; color: #aaa; text-transform: uppercase; }
    .stat-val { font-size: 1.1em; font-weight: bold; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Llama Cluster Status</h1>
  <div id="content">Loading...</div>

  <script>
    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        
        let html = '';
        
        // Node0
        html += '<div class="card">';
        html += `<h2>Node0 Node <span class="badge ${data.node0.running ? 'running' : ''}">${data.node0.running ? 'Running' : 'Stopped'}</span></h2>`;
        
        const host = data.node0.host === '0.0.0.0' ? window.location.hostname : data.node0.host;
        html += `<div class="info-row"><span>Endpoint:</span> <a href="http://${host}:${data.node0.port}" target="_blank" style="color: #4CAF50;">http://${host}:${data.node0.port}</a></div>`;
        html += `<div class="info-row"><span>Tokens Today:</span> <span>${data.node0.tokensToday}</span></div>`;
        
        if (data.node0.gpuStats) {
          const s = data.node0.gpuStats;
          html += '<div class="stats-row">';
          html += `<div class="stat-box"><div class="stat-label">GPU Util</div><div class="stat-val">${s.util}%</div></div>`;
          html += `<div class="stat-box"><div class="stat-label">VRAM</div><div class="stat-val">${(s.memUsed/1024).toFixed(1)}GB / ${(s.memTotal/1024).toFixed(1)}GB</div></div>`;
          html += `<div class="stat-box"><div class="stat-label">Power</div><div class="stat-val">${s.power}W</div></div>`;
          html += '</div>';
        }
        
        html += '</div>';

        // Nodes
        html += `<h3>Node Nodes (${data.nodes.length})</h3>`;
        if (data.nodes.length === 0) {
          html += '<p style="color: #888;">No nodes configured.</p>';
        } else {
          data.nodes.forEach(node => {
            html += '<div class="card" style="border-left: 4px solid #00BCD4;">';
            html += `<h2 style="color: #00BCD4;">${node.label || node.id} <span class="badge ${node.running ? 'running' : ''}">${node.running ? 'Running' : 'Stopped'}</span></h2>`;
            html += `<div class="info-row"><span>IP Address:</span> <span>${node.ip || 'Unknown'}</span></div>`;
            
            if (node.gpuStats) {
              const s = node.gpuStats;
              html += '<div class="stats-row">';
              html += `<div class="stat-box"><div class="stat-label">GPU Util</div><div class="stat-val">${s.util}%</div></div>`;
              html += `<div class="stat-box"><div class="stat-label">VRAM</div><div class="stat-val">${(s.memUsed/1024).toFixed(1)}GB / ${(s.memTotal/1024).toFixed(1)}GB</div></div>`;
              html += `<div class="stat-box"><div class="stat-label">Power</div><div class="stat-val">${s.power}W</div></div>`;
              html += '</div>';
            } else if (node.running) {
               html += '<div class="info-row"><span style="color:#aaa; font-size:0.8em;">Waiting for stats...</span></div>';
            }
            
            html += '</div>';
          });
        }

        document.getElementById('content').innerHTML = html;
      } catch (err) {
        document.getElementById('content').innerHTML = `<p style="color: red;">Error fetching status: ${err.message}</p>`;
      }
    }

    fetchStatus();
    setInterval(fetchStatus, 2000);
  </script>
</body>
</html>
